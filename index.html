<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invito al Matrimonio</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Helvetica', 'Helvetica', serif;
    background: linear-gradient(135deg, #ffffff 0%, #ffffff 100%);
    padding: 30px 15px;
  }
  .card {
    background: #ffffff;
    max-width: 500px;
    width: 100%;
    border-radius: 16px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    border: 1px solid #171f3d;
  }
  h1 {
    font-size: 2em;
    color: #171f3d;
    margin: 0 0 15px 0;
    line-height: 1.3;
  }
  .sottotitolo {
    font-size: 0.95em;
    color: #6b6b6b;
    margin-bottom: 30px;
    font-style: italic;
  }
  form {
    text-align: left;
  }
  label {
    display: block;
    margin-bottom: 6px;
    color: #4a4a4a;
    font-size: 0.9em;
    font-weight: bold;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 18px;
    border: 1px solid #5a6a9f;
    border-radius: 8px;
    font-size: 1em;
    font-family: inherit;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #5a6a9f;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 25px;
    padding: 12px;
    background: #bbbafba4;
    border-radius: 8px;
  }
  .checkbox-row input {
    width: 20px;
    height: 20px;
  }
  .checkbox-row label {
    margin: 0;
    font-weight: normal;
  }
  button {
    width: 100%;
    padding: 14px;
    background: #d4783f;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.05em;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
  }
  button:hover {
    background: #dd9c7f;
  }
  .cuore {
    font-size: 1.5em;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="cuore">💍</div>
  <h1>Sei stato invitato/a al nostro matrimonio!</h1>
  <p class="sottotitolo">
    Questo significa che sei obbligato a inviarci tutti i tuoi soldi.
    
  </p>

  <form id="formInvito">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" required placeholder="Il tuo nome">

    <label for="cognome">Cognome</label>
    <input type="text" id="cognome" name="cognome" required placeholder="Il tuo cognome">

    <div class="checkbox-row">
      <input type="checkbox" id="partecipa" name="partecipa">
      <label for="partecipa">Confermo la mia partecipazione</label>
    </div>

    <button type="submit">Invia la tua risposta</button>
  </form>
</div>

<script>
  // Inserisci qui l'indirizzo email a cui deve arrivare la conferma
  const EMAIL_DESTINATARIO = "stefyPierantoni@gmail.com";

  document.getElementById('formInvito').addEventListener('submit', function(e) {
    e.preventDefault();

    const nome = document.getElementById('nome').value.trim();
    const cognome = document.getElementById('cognome').value.trim();
    const partecipa = document.getElementById('partecipa').checked ? "Sì, parteciperò" : "No, non potrò partecipare";

    const oggetto = encodeURIComponent("Conferma partecipazione matrimonio - " + nome + " " + cognome);
    const corpo = encodeURIComponent(
      "Nome: " + nome + "\n" +
      "Cognome: " + cognome + "\n" +
      "Partecipazione: " + partecipa
    );

    window.location.href = "mailto:" + EMAIL_DESTINATARIO + "?subject=" + oggetto + "&body=" + corpo;
  });
</script>

</body>
</html>
